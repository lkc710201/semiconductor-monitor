name: Weekly Saturday Monitor

on:
  schedule:
    - cron: '0 0 * * 6' # 每週六 UTC 00:00 (台灣時間 CST 早上 08:00)
  workflow_dispatch:     # 允許網頁手動觸發測試

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monitor Script
        run: |
          python -c "import monitor_engine as e; e.save_record(e.evaluate_indicators())"

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_history.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update weekly indicators [skip ci]"
            git push
          fi
